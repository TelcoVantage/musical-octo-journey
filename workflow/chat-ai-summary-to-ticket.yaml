# Archy flow definition (Genesys Cloud Architect workflow).
#
# Convert to an Architect GUI import file with:   workflow/Build-I3WorkFlow.ps1
# (or build-i3workflow.sh) - this produces "Chat - AI Summary to Ticket.i3WorkFlow".
#
# The names under "category:" must match the INTEGRATION names in your org exactly,
# and the names under "dataAction:" must match PUBLISHED data action names exactly.
workflow:
  name: Chat - AI Summary to Ticket
  description: >-
    Started by a trigger when after-conversation work completes on a chat.
    Reads the ticket number the agent script stored on the conversation
    (participant attribute ticketReturnCode), fetches the AI summary and
    posts it to the ticket with the Update Ticket data action.
  startUpRef: "/workflow/states/state[Initial State_10]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      none: true
  variables:
    # Filled by the trigger (must be named exactly like the event attribute).
    - stringVariable:
        name: Flow.conversationId
        initialValue:
          noValue: true
        isInput: true
        isOutput: false
    - stringVariable:
        name: Flow.ticketNumber
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.generatedSummary
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.editedSummary
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.summaryReason
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.summaryResolution
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.summaryFollowup
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.summaryText
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.journalText
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
  states:
    - state:
        name: Initial State
        refId: Initial State_10
        actions:
          # 1. Ticket number written by the script (Output variable ticketReturnCode).
          - callData:
              name: Get ticket number from conversation
              timeout:
                lit:
                  seconds: 30
              category:
                Genesys Cloud Data Actions:
                  dataAction:
                    Get Conversation Ticket Number:
                      inputs:
                        conversationId:
                          exp: Flow.conversationId
                      successOutputs:
                        ticketNumber:
                          var: Flow.ticketNumber
              outputs:
                failure:
                  actions:
                    - endWorkflow:
                        name: End - ticket lookup failed
                        exitReason:
                          noValue: true
                timeout:
                  actions:
                    - endWorkflow:
                        name: End - ticket lookup timed out
                        exitReason:
                          noValue: true
          # 2. No ticket was created on this chat: nothing to do.
          - decision:
              name: No ticket on this chat?
              condition:
                exp: IsNotSetOrEmpty(Flow.ticketNumber)
              outputs:
                "yes":
                  actions:
                    - endWorkflow:
                        name: End - no ticket
                        exitReason:
                          noValue: true
          # 3. AI summary of the conversation.
          - callData:
              name: Get AI summary
              timeout:
                lit:
                  seconds: 30
              category:
                Genesys Cloud Data Actions:
                  dataAction:
                    Get Conversation AI Summary:
                      inputs:
                        conversationId:
                          exp: Flow.conversationId
                      successOutputs:
                        summary:
                          var: Flow.generatedSummary
                        editedSummary:
                          var: Flow.editedSummary
                        reason:
                          var: Flow.summaryReason
                        resolution:
                          var: Flow.summaryResolution
                        followup:
                          var: Flow.summaryFollowup
              outputs:
                failure:
                  actions:
                    - endWorkflow:
                        name: End - summary lookup failed
                        exitReason:
                          noValue: true
                timeout:
                  actions:
                    - endWorkflow:
                        name: End - summary lookup timed out
                        exitReason:
                          noValue: true
          # 4. Prefer the agent-edited summary over the generated one.
          - updateData:
              name: Pick summary text
              statements:
                - string:
                    variable: Flow.summaryText
                    value:
                      exp: If(IsNotSetOrEmpty(Flow.editedSummary), Flow.generatedSummary, Flow.editedSummary)
          - decision:
              name: No summary available?
              condition:
                exp: IsNotSetOrEmpty(Flow.summaryText)
              outputs:
                "yes":
                  actions:
                    - endWorkflow:
                        name: End - no summary
                        exitReason:
                          noValue: true
          # 5. Text that goes into the ticket journal.
          - updateData:
              name: Build journal text
              statements:
                - string:
                    variable: Flow.journalText
                    value:
                      exp: 'Append("Genesys Cloud AI summary: ", Flow.summaryText, If(IsNotSetOrEmpty(Flow.summaryReason), "", Append(" | Reason: ", Flow.summaryReason)), If(IsNotSetOrEmpty(Flow.summaryResolution), "", Append(" | Resolution: ", Flow.summaryResolution)), If(IsNotSetOrEmpty(Flow.summaryFollowup), "", Append(" | Follow-up: ", Flow.summaryFollowup)), " | Conversation ID: ", Flow.conversationId)'
          # 6. Post it to the ticket.
          - callData:
              name: Update ticket with AI summary
              timeout:
                lit:
                  seconds: 30
              category:
                Rabobank ITSM API PROD:
                  dataAction:
                    Update Ticket (v8):
                      inputs:
                        Key:
                          exp: Flow.ticketNumber
                        JournalUpdate:
                          exp: Flow.journalText
          - endWorkflow:
              name: End Workflow
              exitReason:
                noValue: true
